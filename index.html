<script>
  // HIER Backend-URL:
  const BACKEND_URL = "https://example.com/api/claim";

  const connectBtn = document.getElementById("connectBtn");
  const claimBtn = document.getElementById("claimBtn");
  const statusEl = document.getElementById("status");
  const addressBox = document.getElementById("addressBox");
  const networkEl = document.getElementById("network");

  let currentAccount = null;

  function setStatus(message, type = "info") {
    statusEl.textContent = message;
    statusEl.className = "";
    if (type === "info") statusEl.classList.add("status-info");
    if (type === "success") statusEl.classList.add("status-success");
    if (type === "error") statusEl.classList.add("status-error");
  }

  function shortenAddress(addr) {
    if (!addr) return "";
    return addr.slice(0, 6) + "..." + addr.slice(-4);
  }

  // Debug: direkt beim Laden anzeigen, ob ein Provider da ist
  if (!window.ethereum) {
    networkEl.textContent = "Kein window.ethereum – kein Wallet-Provider im Kontext.";
  } else {
    networkEl.textContent = "Wallet-Provider gefunden (window.ethereum vorhanden).";
  }

  async function updateNetworkInfo() {
    if (!window.ethereum) {
      return;
    }
    try {
      const chainId = await window.ethereum.request({ method: "eth_chainId" });
      networkEl.innerHTML =
        "Wallet-Provider gefunden · Chain ID: " +
        chainId +
        ' <span class="badge">Nutze diese Chain für deinen QR-Token</span>';
    } catch (err) {
      console.log("Fehler bei eth_chainId:", err);
    }
  }

  async function connectWallet() {
    if (!window.ethereum) {
      setStatus("MetaMask nicht gefunden. Läuft die Seite sicher im MetaMask-Browser?", "error");
      return;
    }

    try {
      setStatus("Step 1: connectWallet gestartet…", "info");

      // MetaMask Mobile: dieser Aufruf MUSS ein Popup/Sheet triggern
      setStatus("Step 2: request eth_requestAccounts…", "info");
      const accounts = await window.ethereum.request({
        method: "eth_requestAccounts",
      });

      setStatus("Step 3: Antwort von eth_requestAccounts erhalten.", "info");

      if (!accounts || accounts.length === 0) {
        setStatus("Keine Accounts erhalten.", "error");
        return;
      }

      currentAccount = accounts[0];
      addressBox.style.display = "block";
      addressBox.textContent = "Verbunden: " + currentAccount;
      claimBtn.disabled = false;
      setStatus("Wallet verbunden: " + shortenAddress(currentAccount), "success");

      await updateNetworkInfo();
    } catch (err) {
      console.log("Fehler in connectWallet:", err);
      // Auf Mobile hast du kein F12, deshalb alles in den Status schreiben
      setStatus(
        "Verbindung abgelehnt oder Fehler: " +
          (err && (err.message || err.code || JSON.stringify(err))),
        "error"
      );
    }
  }

  async function sendClaim() {
    if (!currentAccount) {
      setStatus("Bitte zuerst Wallet verbinden.", "error");
      return;
    }
    if (!BACKEND_URL || BACKEND_URL.includes("DEIN-BACKEND-HIER")) {
      setStatus("BACKEND_URL ist noch nicht konfiguriert.", "error");
      return;
    }

    claimBtn.disabled = true;
    setStatus("Sende Claim an Backend…", "info");

    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ address: currentAccount }),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        const msg =
          data && data.error
            ? data.error
            : "Fehler beim Claim (HTTP " + res.status + ")";
        setStatus(msg, "error");
        claimBtn.disabled = false;
        return;
      }

      const hashText = data.txHash ? " Tx Hash: " + data.txHash : "";
      setStatus("Claim erfolgreich gesendet." + hashText, "success");
      claimBtn.disabled = true;
    } catch (err) {
      setStatus("Netzwerk-/Backendfehler: " + (err.message || "Unbekannt"), "error");
      claimBtn.disabled = false;
    }
  }

  connectBtn.addEventListener("click", connectWallet);
  claimBtn.addEventListener("click", sendClaim);

  updateNetworkInfo();

  if (window.ethereum) {
    window.ethereum.on("accountsChanged", (accounts) => {
      if (!accounts || accounts.length === 0) {
        currentAccount = null;
        addressBox.style.display = "none";
        claimBtn.disabled = true;
        setStatus("Wallet getrennt.", "info");
      } else {
        currentAccount = accounts[0];
        addressBox.style.display = "block";
        addressBox.textContent = "Verbunden: " + currentAccount;
        claimBtn.disabled = false;
        setStatus("Wallet gewechselt: " + shortenAddress(currentAccount), "info");
      }
    });

    window.ethereum.on("chainChanged", () => {
      updateNetworkInfo();
    });
  }
</script>
